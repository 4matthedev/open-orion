[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-orion"
version = "2.8.2"
description = "Autonomous terminal-based AI agent (JARVIS-style) — natural language to safe shell commands."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "ai", "llm", "ollama", "cli", "assistant", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "rich>=13.7,<14",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Cloud API backends (OpenAI / Anthropic via LiteLLM).
api = [
    "litellm>=1.40",
]
# Local voice: speech-to-text (faster-whisper) + TTS (piper / Kokoro / XTTS).
voice = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "espeakng-loader>=0.2",
    "piper-tts>=1.3",
    "coqui-tts>=0.24",
]
# Streaming voice-cloning pipeline (tools/voice_pipeline.py).
voice-pipeline = [
    "f5-tts>=1.1",
    "transformers>=4.57,<5",
]
# Everything above (mirrors requirements.txt).
all = [
    "litellm>=1.40",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "espeakng-loader>=0.2",
    "piper-tts>=1.3",
    "coqui-tts>=0.24",
    "f5-tts>=1.1",
    "transformers>=4.57,<5",
]

[project.scripts]
orion = "orion.cli:main"
orion-gui = "orion.gui:main"
orion-hud = "jarvis_hud:main"

[tool.setuptools]
packages = ["orion"]
py-modules = ["main", "jarvis_hud"]

[tool.setuptools.package-data]
orion = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors (default set)
    "E7",   # pycodestyle errors (default set)
    "E9",   # pycodestyle errors (default set)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "DTZ",  # flake8-datetimez
    "EXE",  # scripts with a shebang must be executable
    "BLE",  # flake8-blind-except
    "PLW1510",  # subprocess.run without explicit check
    "PLR0402",  # pointless import alias
    "PLC0415",  # import-outside-top-level (lazy imports are intentional)
]
ignore = [
    "E501",  # long lines are intentional (prose prompts, URLs, regexes)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]  # assertions are the point of unit tests
# Executing shell commands is the product; tools are resolved via shutil.which.
"orion/executor.py" = ["S603", "S607"]
"orion/voice.py" = ["S603", "S607"]
"tools/voice_pipeline.py" = ["S603", "S607"]
